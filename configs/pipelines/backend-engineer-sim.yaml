# Offline config: the simulated model stands in for Claude so the full pipeline
# and eval suite run without network access. Not for real candidates.
rubric: backend-engineer-2026q4@v1
intake:
  min_font_pt: 4
  color_delta_threshold: 0.05
  on_hidden_text: flag_for_review
parse:
  model: simulated-v1
  effort: low
redact:
  fields: [name, contact, photo, address, links]
  optional: []
  free_text: {neutralize_pronouns: true, term_lists: [affinity_orgs]}
score:
  model: simulated-v1
  effort: medium
  samples: 3
  instability_threshold: 1
  flag_tier_straddle: true
aggregate:
  tiers: {strong: 0.75, review: 0.45}
  must_have_cap: review
review:
  open_sla_days: 5
  hold_alert_days: 14
  blind_first_look: false
