[project]
name = "screener"
version = "0.1.0"
description = "Evidence-backed resume screening pipeline with human review"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=2.3,<3",
  "pymupdf>=1.26",
  "python-docx>=1.1",
  "pydantic>=2.7",
  "pyyaml>=6",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
screener = "screener.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["screener*"]

[tool.setuptools.package-data]
"screener.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Anthropic API (needs ANTHROPIC_API_KEY and --live)", "postgres: needs a Postgres DATABASE_URL"]
